[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-kansuji-guard"
version = "0.1.0"
description = "Convert Japanese kanji numerals to digits without breaking names, places or idioms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "NEXUS tools" }]
keywords = ["mcp", "mcp-server", "japanese", "ai-agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Japanese",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
jp-kansuji-guard = "kansujiguard.server:main"

[project.urls]
Homepage = "https://github.com/ayatrader/jp-kansuji-guard"
Source = "https://github.com/ayatrader/jp-kansuji-guard"

[tool.setuptools]
packages = ["kansujiguard"]
